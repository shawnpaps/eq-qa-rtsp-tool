version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rtsp-network

  backend:
    build: ./backend
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=development
      - MEDIAMTX_HOST=${MEDIAMTX_HOST:-mediamtx}
      - MEDIAMTX_INTERNAL_HOST=${MEDIAMTX_INTERNAL_HOST:-mediamtx}
      - MEDIAMTX_PORT=${MEDIAMTX_PORT:-8554}
      - DATA_DIR=/data
    depends_on:
      - mediamtx
    networks:
      - rtsp-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    networks:
      - rtsp-network

networks:
  rtsp-network:
    driver: bridge
